name: Desktop builds
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo install tauri-cli --version 2.10.1 --locked
      - run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: flow2api-${{ matrix.artifact }}
          path: |
            desktop/target/**/release/bundle/nsis/*-setup.exe
            desktop/target/**/release/bundle/dmg/*.dmg
            desktop/target/**/release/bundle/macos/*.app
          if-no-files-found: error
