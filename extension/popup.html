<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步 Flow 登录态到 Flow2API</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #111827; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { color: #4b5563; font-size: 12px; line-height: 1.5; margin: 6px 0 14px; }
    label { display: block; font-weight: 600; font-size: 12px; margin: 12px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button { border: 0; border-radius: 7px; padding: 9px 12px; cursor: pointer; background: #0f766e; color: white; font-weight: 600; }
    button:hover { background: #115e59; }
    button.secondary { background: #e5e7eb; color: #111827; font-weight: normal; white-space: nowrap; }
    button.secondary:hover { background: #d1d5db; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 20px; margin-top: 12px; white-space: pre-wrap; color: #047857; font-size: 12px; line-height: 1.6; }
    #status.error { color: #b91c1c; }
    small { color: #6b7280; font-size: 11px; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>同步 Flow 登录态</h1>
  <p>在当前标签页登录 Flow (flow.google.com) 后，点击下方按钮一键导入到 Flow2API 桌面版。</p>
  <label for="serverUrl">Flow2API 地址</label>
  <input id="serverUrl" value="http://127.0.0.1:8000">
  <label for="email">Google 账号邮箱（可选）</label>
  <div class="row">
    <input id="email" type="email" placeholder="留空可自动读取页面头像">
    <button id="detect" class="secondary" type="button">读取页面</button>
  </div>
  <small>Cookie 仅通过本地环回发送到上面的 Flow2API 地址。</small>
  <button id="sync" type="button" style="width:100%;margin-top:16px">同步当前登录态到 Flow2API</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
