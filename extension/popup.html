<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步 Flow 登录态</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #111827; }
    h1 { font-size: 17px; margin: 0 0 6px; }
    p { color: #4b5563; line-height: 1.45; margin: 6px 0 14px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 7px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button { border: 0; border-radius: 7px; padding: 9px 12px; cursor: pointer; background: #111827; color: white; }
    button.secondary { background: #e5e7eb; color: #111827; white-space: nowrap; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 20px; margin-top: 12px; white-space: pre-wrap; color: #065f46; }
    #status.error { color: #b91c1c; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>同步 Flow 登录态</h1>
  <p>请先在当前浏览器标签页登录 Flow，再同步。系统后台必须已登录。</p>
  <label for="serverUrl">Flow2API 地址</label>
  <input id="serverUrl" value="http://127.0.0.1:8000">
  <label for="email">Google 账号邮箱</label>
  <div class="row"><input id="email" type="email" value="account1@example.com" placeholder="name@example.com"><button id="detect" class="secondary" type="button">读取页面</button></div>
  <small>同步会更新同邮箱账号；Cookie 只发送到上面的地址。</small>
  <button id="sync" type="button" style="width:100%;margin-top:16px">同步当前登录态</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
