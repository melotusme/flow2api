<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作工作台 · Flow2API</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><script src="/assets/shell.js"></script><main class="app-main">
<div class="page-intro"><div><h1>生成图片或视频</h1><p>选择模型，写下画面。完成后的作品保存在这台电脑。</p></div></div>
<details class="card connection" id="connection"><summary><span id="connectionState">正在连接本机…</span></summary><div class="connection-grid"><label>服务地址<input id="baseUrl" type="url" aria-label="服务地址"></label><label>调用密钥<input id="apiKey" type="password" autocomplete="new-password" data-lpignore="true" disabled placeholder="本机使用当前调用密钥"></label><button class="btn" id="connectBtn" type="button">重新连接</button></div><small>本机直接使用当前调用密钥。要连另一台服务时，填写那台服务的地址和密钥。</small></details>
<div class="studio-layout"><aside class="card catalog" aria-label="模型选择"><div class="model-row"><h2>模型</h2><span class="pill" id="modelCount">加载中</span></div><div class="catalog-tools"><input id="modelSearch" type="search" aria-label="搜索模型" placeholder="搜索模型、比例、时长"><select id="modelFilter" aria-label="筛选模型类型"><option value="all">全部</option><option value="image">文生图</option><option value="t2v">文生视频</option><option value="i2v">首尾帧</option><option value="r2v">参考图</option><option value="omni">Omni</option><option value="extend">续写</option></select></div><div id="modelSidebar" class="catalog-list" role="group" aria-label="可用模型"></div></aside>
<div class="workspace"><section class="card"><div class="model-row"><span id="selectedFamily" class="muted">模型</span><span class="pill" id="selectedKind">请选择模型</span></div><h2 id="selectedModelName">正在获取模型…</h2><p id="selectedPrice" class="muted"></p><div class="selected-tools"><button type="button" class="btn" id="copyModelId">复制模型 ID</button></div><p id="selectedModelInfo" class="muted"></p><div id="modelDetail" class="model-detail"></div><div id="modelNotice" class="notice" hidden></div>
<div class="form-field"><label for="promptInput">画面描述</label><textarea id="promptInput" placeholder="描述主体、环境、风格。视频还可以写动作和镜头。"></textarea><button type="button" class="linkish" id="promptExample">填入示例：一把黄色陶瓷茶壶，摆在木桌上，柔和晨光，产品摄影，无文字。</button></div>
<div class="form-field" id="imageUploadGroup" hidden><label for="imageFileInput">参考图片 <span id="imageLimit" class="muted"></span></label><div class="upload-zone" id="imageUploadArea"><input type="file" id="imageFileInput" accept="image/*" multiple aria-label="选择参考图片"><small style="display:block;margin-top:8px">点击选择，或把图片拖到这里。每张最多 15 MB。</small><div id="imagePreviewList" class="upload-previews"></div></div></div>
<div class="form-field" id="videoIdGroup" hidden><label for="videoMediaId">要续写的视频</label><input id="videoMediaId" placeholder="粘贴续写编号"><small>从上一条视频结果，或从本机资源复制续写编号。不能填写普通视频网址。</small></div>
<div id="validationError" class="notice error" role="alert" hidden></div><div class="form-bottom"><small id="costHint">选择模型后查看费用。</small><button class="btn btn-primary" id="btnGenerate" type="button" disabled>开始生成</button></div></section>
<section class="card"><div class="status-line"><div><h2 id="statusText" aria-live="polite">等待生成</h2></div><span class="pill" id="elapsed">就绪</span></div><div id="outputResult" class="output-result"><div class="output-empty">作品会出现在这里<br><small>生成过程可以在下方日志查看</small></div></div><details id="logDetails"><summary class="muted">过程日志</summary><pre id="outputLog" aria-live="off">尚未发起请求。</pre></details></section>
</div></div></main><div id="modelTooltip" class="tooltip" role="tooltip" hidden></div><script src="/assets/studio-core.js"></script><script src="/assets/studio.js"></script></body></html>
