<!DOCTYPE html>
<html data-i18n-page="login" lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="登录 - Flow2API">管理员登录 - Flow2API</title>
    <script src="/static/i18n.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slide-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        .animate-slide-up{animation:slide-up .3s ease-out}
    </style>
    <script>
        tailwind.config={theme:{extend:{colors:{border:"hsl(0 0% 89%)",input:"hsl(0 0% 89%)",ring:"hsl(0 0% 3.9%)",background:"hsl(0 0% 100%)",foreground:"hsl(0 0% 3.9%)",primary:{DEFAULT:"hsl(0 0% 9%)",foreground:"hsl(0 0% 98%)"},secondary:{DEFAULT:"hsl(0 0% 96.1%)",foreground:"hsl(0 0% 9%)"},muted:{DEFAULT:"hsl(0 0% 96.1%)",foreground:"hsl(0 0% 45.1%)"},destructive:{DEFAULT:"hsl(0 84.2% 60.2%)",foreground:"hsl(0 0% 98%)"}}}}}
    </script>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="h-full bg-background text-foreground antialiased">
    <div class="fixed top-4 right-4"><select data-language-select aria-label="Language" class="h-8 rounded-md border border-input bg-background px-2 text-xs"><option value="zh-CN">中文</option><option value="en">English</option></select></div>
    <div class="flex min-h-full flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center">
                <h1 class="text-4xl font-bold">管理员登录</h1>
                <p class="mt-2 text-sm text-muted-foreground">这是本机管理账号，不是 Google 邮箱。</p>
            </div>
        </div>

        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="login-card">
                <form id="loginForm" method="post" action="/api/login" class="space-y-6">
                    <p id="loginError" class="login-error notice error" role="alert" hidden></p>
                    <div class="space-y-2">
                        <label for="username" class="text-sm font-medium">管理员用户名</label>
                        <input type="text" id="username" name="username" autocomplete="username" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50">
                    </div>
                    <div class="space-y-2">
                        <label for="password" class="text-sm font-medium">管理员密码</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50">
                    </div>
                    <button type="submit" id="loginButton" class="inline-flex items-center justify-center rounded-md font-medium transition-colors bg-primary text-primary-foreground hover:bg-primary/90 h-10 w-full disabled:opacity-50"><span data-i18n="登录">登录</span></button>
                </form>

                <div class="mt-6 text-center text-xs text-muted-foreground">
                    <p>Flow2API · 图片与视频工作区</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form=document.getElementById('loginForm'),btn=document.getElementById('loginButton'),loginError=document.getElementById('loginError');
        const showError=message=>{loginError.hidden=!message;I18n.setRawText(loginError,message||'');loginError.dataset.i18nError='';I18n.apply(loginError)};
        form.addEventListener('input',()=>showError(''));
        form.addEventListener('submit',async(e)=>{e.preventDefault();showError('');btn.disabled=true;I18n.setMessage(btn,I18n.t("登录中..."));try{const fd=new FormData(form),r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{...I18n.headers(),'Content-Type':'application/json'},body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});const d=await r.json();if(d.success){location.href='/test'}else showError(d.message||d.detail||I18n.t('登录失败'))}catch(e){showError('网络错误，请稍后再试')}finally{btn.disabled=false;I18n.setMessage(btn,I18n.t("登录"))}});
        window.addEventListener('DOMContentLoaded',()=>{fetch('/api/stats',{credentials:'include'}).then(r=>{if(r.ok)location.href='/test'}).catch(()=>{})});
    </script>
</body>
</html>
